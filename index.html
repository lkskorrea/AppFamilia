<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Família</title>
  <style>
    /* Variáveis de Cores - Tons Pastéis */
    :root {
      --primary: #b39ddb; /* Lilás pastel */
      --secondary: #e1bee7;
      --bg-color: #f8f9fa; /* Fundo off-white */
      --text-dark: #4a4a4a;
      --card-bg: #ffffff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Ecrã de Login --- */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, var(--secondary), var(--primary));
    }

    .login-card {
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 80%;
      max-width: 320px;
    }

    .login-card h2 {
      margin-top: 0;
      color: var(--primary);
    }

    input {
      width: 90%;
      padding: 14px;
      margin: 20px 0;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button.btn-login {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background-color: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(179, 157, 219, 0.4);
    }

    /* --- Aplicação Principal --- */
    #main-app {
      display: none;
      padding: 20px;
      padding-bottom: 100px; /* Espaço para o menu pílula */
    }

    .header {
      margin-bottom: 30px;
      margin-top: 20px;
    }

    .greeting {
      font-size: 1.8em;
      font-weight: 700;
      color: var(--text-dark);
    }
    
    .greeting span {
      color: var(--primary);
    }

    /* --- Menu Pílula Flutuante --- */
    .pill-nav {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 50px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
      display: flex;
      gap: 20px;
      z-index: 1000;
    }

    .nav-item {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: transparent;
    }

    .nav-item.active {
      background: var(--primary);
      color: white;
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(179, 157, 219, 0.4);
    }

    /* Área de conteúdo temporária para ver o design */
    .modulo-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- Ecrã de Login -->
  <div id="login-screen">
    <div class="login-card">
      <h2>Bem-vindo!</h2>
      <p>Como se chama?</p>
      <input type="text" id="username-input" placeholder="O seu nome" autocomplete="off">
      <button class="btn-login" onclick="entrar()">Entrar</button>
    </div>
  </div>

  <!-- Aplicação Principal -->
  <div id="main-app">
    <div class="header">
      <div class="greeting" id="greeting-text">Bom dia, <span>Nome</span>!</div>
      <p style="color: #888; margin-top: 5px;">Aqui estão as atualizações da família.</p>
    </div>
    
    <!-- Exemplo de como ficarão os cartões na Parte 2 e 3 -->
    <div class="modulo-card">
      <h3>Área de Conteúdo</h3>
      <p>Na próxima etapa, colocaremos aqui o Calendário interativo e a secção de Metas financeiras.</p>
    </div>

    <!-- Menu Pílula -->
    <div class="pill-nav">
      <div class="nav-item active" onclick="mudarMenu(this)">🏠</div>
      <div class="nav-item" onclick="mudarMenu(this)">💬</div>
      <div class="nav-item" onclick="mudarMenu(this)">📅</div>
      <div class="nav-item" onclick="mudarMenu(this)">🎯</div>
      <div class="nav-item" onclick="mudarMenu(this)">⚙️</div>
    </div>
  </div>

  <script>
    // Função para definir Bom dia / Boa tarde / Boa noite
    function atualizarSaudacao(nome) {
      const hora = new Date().getHours();
      let saudacao = "Boa noite";
      
      if (hora >= 5 && hora < 12) {
        saudacao = "Bom dia";
      } else if (hora >= 12 && hora < 19) {
        saudacao = "Boa tarde";
      }
      
      document.getElementById('greeting-text').innerHTML = `${saudacao}, <span>${nome}</span>!`;
    }

    // Função ativada ao clicar em "Entrar"
    function entrar() {
      const nome = document.getElementById('username-input').value.trim();
      if (nome !== "") {
        // Guarda o nome na memória do dispositivo
        localStorage.setItem('nomeUtilizador', nome);
        iniciarApp(nome);
      } else {
        alert("Por favor, introduza o seu nome.");
      }
    }

    // Esconde o login e mostra a aplicação
    function iniciarApp(nome) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      atualizarSaudacao(nome);
      
      // NOTA: É aqui que vamos reinserir a sua configuração do Firebase na Parte 2 e 3
    }

    // Animação simples do menu pílula
    function mudarMenu(elemento) {
      // Remove a classe 'active' de todos
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      // Adiciona ao que foi clicado
      elemento.classList.add('active');
    }

    // Verifica ao abrir o ficheiro se o utilizador já guardou o nome antes
    window.onload = () => {
      const nomeGuardado = localStorage.getItem('nomeUtilizador');
      if (nomeGuardado) {
        iniciarApp(nomeGuardado);
      }
    }
  </script>
</body>
</html>
